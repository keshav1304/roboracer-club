[workspace]
name = "f1tenth-rviz"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64"]

[system-requirements]
macos = "14.0"

[dependencies]
ros-jazzy-rviz2 = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-rosgraph-msgs = "*"
ros-jazzy-ros2cli = "*"

[tasks]
bridge = "python ros_display.py"
rviz = "rviz2 -d planner.rviz"
